name: Validate existing release APK UI
on:
  push:
    branches: [fix/apk-ui-validation]
permissions:
  contents: read
  actions: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '38057829803'
      SOURCE_SHA: '22f122f0e68adc33b837ca5058bea9b7a519ebb6'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify native builds and source provenance
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs" > jobs.json
          python3 - <<'PY'
          import os,json
          assert json.load(open('run.json'))['head_sha']==os.environ['SOURCE_SHA']
          import subprocess,time
          names=['validate','build (arm64)','build (universal)']
          for attempt in range(30):
              data=subprocess.check_output(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['SOURCE_RUN']}/jobs"],text=True)
              jobs=json.loads(data)['jobs']
              selected=[j for j in jobs if j['name'] in names]
              assert not any(j['conclusion'] in ['failure','cancelled','timed_out'] for j in selected), selected
              if len(selected)==3 and all(j['conclusion']=='success' for j in selected):break
              print('Waiting for native APK build',attempt+1,flush=True)
              time.sleep(20)
          else:raise RuntimeError('Native builds not ready')
          PY
          python3 -m py_compile scripts/smoke-android.py
      - uses: actions/download-artifact@v4
        with:
          name: H0sS-Money-release-universal
          path: output
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
      - name: Check APK bytes
        run: |
          python3 - <<'PY'
          import pathlib,hashlib
          p=pathlib.Path('output/H0sS-Money-1.1.0-universal.apk')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==pathlib.Path('output/SHA256SUMS.txt').read_text().split()[0]
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/smoke-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-ui-api-${{ matrix.api }}
          path: smoke/
          if-no-files-found: ignore
