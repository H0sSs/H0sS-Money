name: Publish verified 1.2.2 APKs
on:
  push:
    branches: [fix/publish-1.2.2]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '38263271725'
      SOURCE_SHA: 'ab30a8dfd44e7fdf17b3b3f5e5fe9ed9820bc2c3'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Require successful exact-source build and Android checks
        run: |
          python3 - <<'PY'
          import subprocess,json,time,os
          repo=os.environ['GITHUB_REPOSITORY']
          def get(path):return json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/'+path],text=True))
          for attempt in range(120):
              r=get('actions/runs/'+os.environ['SOURCE_RUN'])
              assert r['head_sha']==os.environ['SOURCE_SHA']
              if r['status']=='completed':
                  assert r['conclusion']=='success',r['conclusion']
                  break
              print('Waiting for source build/QA',attempt+1,flush=True);time.sleep(15)
          else:raise RuntimeError('Build not ready')
          jobs={j['name']:j['conclusion'] for j in get('actions/runs/'+os.environ['SOURCE_RUN']+'/jobs')['jobs']}
          assert all(jobs.get(n)=='success' for n in ['validate','build (arm64)','build (universal)','smoke (35)','smoke (36)'])
          PY
      - uses: actions/download-artifact@v4
        with:
          name: H0sS-Money-release-arm64
          path: downloads/arm64
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: H0sS-Money-release-universal
          path: downloads/universal
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: android-smoke-evidence-api-*
          path: qa
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
      - name: Verify release packages and prepare files
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,shutil,zipfile,os
          dst=pathlib.Path('delivery');dst.mkdir();sums=[];rows=[]
          for variant in ['arm64','universal']:
              folder=pathlib.Path('downloads')/variant;apk=folder/f'H0sS-Money-1.2.2-{variant}.apk'
              digest=hashlib.sha256(apk.read_bytes()).hexdigest()
              assert digest==(folder/'SHA256SUMS.txt').read_text().split()[0]
              assert 'fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c' in (folder/'signature.txt').read_text()
              package=(folder/'package.txt').read_text()
              assert "name='com.hossmoney.app'" in package and "versionName='1.2.2'" in package and "versionCode='5'" in package and 'application-debuggable' not in package
              shutil.copy2(apk,dst/apk.name);sums.append(digest+'  '+apk.name)
              rows.append(f'| {variant} | {apk.stat().st_size/1000000:.2f} MB |')
          for api in [35,36]:
              assert (pathlib.Path('qa')/f'android-smoke-evidence-api-{api}'/'result.txt').read_text().startswith('PASS:')
          (dst/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n')
          with zipfile.ZipFile(dst/'H0sS-Money-1.2.2-UI-QA.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(pathlib.Path('qa').rglob('*')):
                  if p.is_file() and p.suffix in ['.png','.xml','.txt','.mp4'] and p.name!='logcat.txt':z.write(p,p.relative_to('qa'))
          note='''# H0sS-Money 1.2.2

          توحيد الخط العربي بخط Tajawal في كل الواجهات وحقول الإدخال والتقارير، بأوزان عادي ومتوسط وعريض مع الحفاظ على وزن النصوص المتداخلة.

          إصلاح مراحل البداية بخلفية كحلية واحدة وشعار شفاف كامل من غير مربع أو دائرة إضافية. إخفاء شاشة البداية بعد تجهيز أول إطار، وتحميل الثيم المحفوظ قبل عرض الواجهة.

          وظائف الصوت ومزوّدو الذكاء الاصطناعي لم تتغير.

          | النسخة | حجم APK |
          | --- | --- |
          '''+'\n'.join(rows)+'''

          نجح TypeScript و19 اختبارًا و18/18 فحص Expo وتجهيز Hermes وبناء النسختين وفحص Android 15 و16 والتوقيع وSHA-256. صور الاختبارات مرفقة، وتسجيل الفتح عند دعمه على المحاكي. اختبار البصمة الفعلي وأجهزة Android الأخرى له حدود موضحة في docs/QA-1.2.2.md.

          صدّر نسخة احتياطية وثبّت APK فوق النسخة الحالية دون حذف التطبيق. Android 7+، com.hossmoney.app، versionCode 5؛ التوقيع نفسه المستخدم في 1.2.1.
          '''+'\nBuild: https://github.com/H0sSs/H0sS-Money/actions/runs/'+os.environ['SOURCE_RUN']+'\nSource: '+os.environ['SOURCE_SHA']+'\n'
          (dst/'H0sS-Money-1.2.2-Report.md').write_text('\n'.join(s.strip() for s in note.splitlines())+'\n')
          print('\n'.join(rows))
          PY
      - name: Publish public 1.2.2 release
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.2.2" >/dev/null 2>&1; then echo 'Release exists; refusing overwrite'; exit 1; fi
          gh release create v1.2.2 --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --latest --title "H0sS-Money 1.2.2" --notes-file delivery/H0sS-Money-1.2.2-Report.md delivery/*.apk delivery/SHA256SUMS.txt delivery/H0sS-Money-1.2.2-Report.md delivery/H0sS-Money-1.2.2-UI-QA.zip
