name: Validate and build release APK
on:
  push:
    branches: [main, master, fix/release-redesign]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run check
      - run: npx expo-doctor
      - run: npx expo export --platform android --output-dir /tmp/android-export
  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [arm64, universal]
    env:
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ matrix.variant }}-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: npm ci --legacy-peer-deps
      - run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: 'true'
      - name: Build optimized APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          if [ '${{ matrix.variant }}' = 'arm64' ]; then
            ARCHS='arm64-v8a'
          else
            ARCHS='armeabi-v7a,arm64-v8a,x86,x86_64'
          fi
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures="$ARCHS" --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Verify APK and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/H0sS-Money-1.1.0-${{ matrix.variant }}.apk
          APK=output/H0sS-Money-1.1.0-${{ matrix.variant }}.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > output/signature.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" > output/package.txt
          if grep -q "application-debuggable" output/package.txt; then echo 'APK is debuggable'; exit 1; fi
          sha256sum "$APK" > output/SHA256SUMS.txt
          stat --printf='APK bytes: %s\n' "$APK" > output/size.txt
          echo 'This review build uses the Expo template development signing certificate. Production signing requires a private keystore.' > output/SIGNING-NOTE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: H0sS-Money-release-${{ matrix.variant }}
          path: output/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ matrix.variant }}
          path: |
            android/build.log
            android/app/build/outputs/mapping/release/
          if-no-files-found: ignore
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: H0sS-Money-release-universal
          path: output
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/smoke-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-evidence-api-${{ matrix.api }}
          path: smoke/
          if-no-files-found: ignore
