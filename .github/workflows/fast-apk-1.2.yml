name: Build verified JavaScript patch APK
on:
  push:
    branches: [fix/final-apk-1.2, feat/1.2-complete]
    paths-ignore: ['docs/**', 'scripts/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run check
      - run: npx expo-doctor
      - run: npx expo export --platform android --output-dir /tmp/android-export
  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [arm64, universal]
    env:
      BASE_NATIVE_SHA: '414872e93247ccc8d6b60ca8da157e5061e38955'
      BASE_NATIVE_RUN: '38157655779'
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require unchanged native inputs
        shell: bash
        run: |
          git diff --name-only "$BASE_NATIVE_SHA" "$GITHUB_SHA" > changed-files.txt
          python3 - <<'PY'
          import pathlib
          allowed={'lib/services.ts','app/(tabs)/index.tsx','app/(tabs)/stats.tsx','components/Icon.tsx','components/ExpenseReview.tsx','tests/core.test.cjs','scripts/smoke-android.py','scripts/smoke-android.sh','.github/workflows/fast-apk-1.2.yml','.github/workflows/build-apk.yml'}
          changed=set(pathlib.Path('changed-files.txt').read_text().splitlines())
          assert changed <= allowed, 'Native input changed; a full build is required'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: H0sS-Money-release-${{ matrix.variant }}
          path: reference
          run-id: ${{ env.BASE_NATIVE_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ matrix.variant }}-${{ hashFiles('package-lock.json') }}-${{ env.BASE_NATIVE_SHA }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ matrix.variant }}-${{ hashFiles('package-lock.json') }}-
            gradle-${{ runner.os }}-${{ matrix.variant }}-
      - run: npm ci --legacy-peer-deps
      - run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: 'true'
      - name: Restore native compilation outputs
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            android/.gradle
            android/app/.cxx
            android/app/build
            node_modules/**/android/.cxx
            node_modules/**/android/build
          key: native-v1-${{ runner.os }}-${{ matrix.variant }}-${{ hashFiles('package-lock.json') }}-${{ env.BASE_NATIVE_SHA }}
      - name: Require exact compiled native cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: echo 'Verified native cache is absent; refusing to skip compilation' && exit 1
      - name: Build optimized APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          if [ '${{ matrix.variant }}' = 'arm64' ]; then
            ARCHS='arm64-v8a'
          else
            ARCHS='armeabi-v7a,arm64-v8a,x86,x86_64'
          fi
          echo "Native build started at $(date -u +%FT%TZ)"
          BUILD_STARTED=$SECONDS
          cd android
          ./gradlew tasks --all -PreactNativeArchitectures="$ARCHS" --console=plain > native-tasks.txt
          mapfile -t NATIVE_TASKS < <(python3 - <<'PY'
          import pathlib
          names=[]
          for line in pathlib.Path('native-tasks.txt').read_text().splitlines():
              if not line.strip():continue
              name=line.split()[0]
              if ('buildCMakeRelWithDebInfo[' in name or 'configureCMakeRelWithDebInfo[' in name or 'buildCMakeRelease[' in name or 'configureCMakeRelease[' in name or name.endswith(':externalNativeBuildRelease') or name.endswith(':generateJsonModelRelease')):
                  names.append(name if name.startswith(':') else ':'+name)
          assert any(n.startswith(':app:buildCMake') for n in names)
          print('\n'.join(names))
          PY
          )
          NATIVE_FLAGS=()
          for TASK in "${NATIVE_TASKS[@]}"; do NATIVE_FLAGS+=(-x "$TASK"); done
          [ "${#NATIVE_FLAGS[@]}" -gt 0 ]
          ./gradlew assembleRelease -PreactNativeArchitectures="$ARCHS" --build-cache --no-daemon "${NATIVE_FLAGS[@]}" --stacktrace 2>&1 | tee build.log
          echo "Native build seconds: $((SECONDS-BUILD_STARTED))" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify APK and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/H0sS-Money-1.2.0-${{ matrix.variant }}.apk
          APK=output/H0sS-Money-1.2.0-${{ matrix.variant }}.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > output/signature.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" > output/package.txt
          if grep -q "application-debuggable" output/package.txt; then echo 'APK is debuggable'; exit 1; fi
          sha256sum "$APK" > output/SHA256SUMS.txt
          stat --printf='APK bytes: %s\n' "$APK" > output/size.txt
          echo 'This review build uses the Expo template development signing certificate. Production signing requires a private keystore.' > output/SIGNING-NOTE.txt
      - name: Require identical native libraries and fresh Hermes bundle
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 - <<'PY'
          import zipfile,pathlib,hashlib,os
          base=pathlib.Path('reference')/('H0sS-Money-1.2.0-'+os.environ['VARIANT']+'.apk')
          expected={'arm64':'57ef0b00f7dda7165078800cb5e8803c3443d438ee1ebf0a1a5f1677e9de8740','universal':'af0b38d52d7439cbe63a328fa77070c3b504fdd19fe20418d9dd205169a05b74'}
          assert hashlib.sha256(base.read_bytes()).hexdigest()==expected[os.environ['VARIANT']]
          new=pathlib.Path('output')/base.name
          with zipfile.ZipFile(base) as a,zipfile.ZipFile(new) as b:
              names={n for n in a.namelist() if n.startswith('lib/') and n.endswith('.so')}
              assert names=={n for n in b.namelist() if n.startswith('lib/') and n.endswith('.so')}
              assert all(hashlib.sha256(a.read(n)).digest()==hashlib.sha256(b.read(n)).digest() for n in names)
              old=a.read('assets/index.android.bundle');fresh=b.read('assets/index.android.bundle')
              assert old[:12]==fresh[:12] and old!=fresh
          assert 'fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c' in pathlib.Path('output/signature.txt').read_text()
          print('APK_METADATA:'+os.environ['VARIANT']+':'+str(new.stat().st_size)+':'+hashlib.sha256(new.read_bytes()).hexdigest())
          print('PASS: every native library matches verified base; updated Hermes bundle and certificate verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: H0sS-Money-release-${{ matrix.variant }}
          path: output/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ matrix.variant }}
          path: |
            android/build.log
            android/app/build/outputs/mapping/release/
          if-no-files-found: ignore
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: H0sS-Money-release-universal
          path: output
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/smoke-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-evidence-api-${{ matrix.api }}
          path: smoke/
          if-no-files-found: ignore
      - name: Emit reviewed UI screenshots
        if: success()
        run: |
          python3 - <<'PY'
          import pathlib,base64
          for name in ['stats-comparison-full.png','settings-light.png','expenses.png']:
              print('QA_IMAGE:'+name+':'+base64.b64encode((pathlib.Path('smoke')/name).read_bytes()).decode())
          PY
