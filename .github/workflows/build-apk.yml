name: Validate and build release APK
on:
  push:
    branches: [main, master, fix/complete-reports-1.2.5]
    paths-ignore: ['README.md', 'CHANGELOG.md', 'docs/**']
    # The implementation branch is checked before merging.
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run check
      - run: node scripts/check-voice-routing.cjs
      - run: npx expo-doctor
      - run: npx expo export --platform android --output-dir /tmp/android-export
      - uses: actions/upload-artifact@v4
        with:
          name: checked-hermes-bundle
          path: /tmp/android-export/_expo/static/js/android/*.hbc
          if-no-files-found: error
  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOSS_APK_VERSION: '1.2.5'
      HOSS_VERSION_CODE: '8'
      HOSS_BASE_VERSION: '1.2.4'
      HOSS_BASE_CODE: '7'
      HOSS_CERTIFICATE_SHA256: '8967c433f04f9e2879f88a95f92c95d268316163d84db3442ef221f415fae91c'
      HOSS_KEYSTORE_PASSWORD: ${{ secrets.HOSS_KEYSTORE_PASSWORD }}
      HOSS_KEY_ALIAS: ${{ secrets.HOSS_KEY_ALIAS }}
      HOSS_KEY_PASSWORD: ${{ secrets.HOSS_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Verify JS-only native compatibility
        run: python3 scripts/check-native-reuse.py
      - uses: actions/download-artifact@v4
        with:
          name: checked-hermes-bundle
          path: /tmp/checked-hermes
      - name: Prepare checked bundle and verified public base APKs
        run: |
          set -euo pipefail
          cp /tmp/checked-hermes/*.hbc /tmp/hoss-index.android.bundle
          for VARIANT in arm64 universal; do
            DIR="base-apks/H0sS-Money-release-$VARIANT"
            mkdir -p "$DIR"
            gh release download v1.2.4 --repo "$GITHUB_REPOSITORY" --pattern "H0sS-Money-1.2.4-$VARIANT.apk" --dir "$DIR"
          done
          printf '%s  %s\n' '92639951945e845a8fded99e79549a28c8841b8608087c7bd9f4204bf278cefd' 'H0sS-Money-1.2.4-arm64.apk' > base-apks/H0sS-Money-release-arm64/SHA256SUMS.txt
          printf '%s  %s\n' '2f5ea69d66796ea745a87aca80307fd91637409759d6d7515aa007a1cae58628' 'H0sS-Money-1.2.4-universal.apk' > base-apks/H0sS-Money-release-universal/SHA256SUMS.txt
      - name: Sign version 1.2.5 with the private release key
        env:
          KEYSTORE_BASE64: ${{ secrets.HOSS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hoss-release.jks"
          chmod 600 "$RUNNER_TEMP/hoss-release.jks"
          export HOSS_KEYSTORE_PATH="$RUNNER_TEMP/hoss-release.jks"
          python3 scripts/rebundle-apks.py
      - uses: actions/upload-artifact@v4
        with:
          name: H0sS-Money-release-arm64
          path: output/arm64/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: H0sS-Money-release-universal
          path: output/universal/
          if-no-files-found: error
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: H0sS-Money-release-universal
          path: output
      - run: python3 -m pip install pypdf pillow
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/smoke-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-evidence-api-${{ matrix.api }}
          path: smoke/
          if-no-files-found: ignore

  publish:
    needs: [validate, build, smoke]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: H0sS-Money-release-*
          path: downloads
      - uses: actions/download-artifact@v4
        with:
          pattern: android-smoke-evidence-api-*
          path: qa
      - name: Verify private signatures and collect release files
        run: |
          set -euo pipefail
          mkdir -p delivery
          for VARIANT in arm64 universal; do
            DIR="downloads/H0sS-Money-release-$VARIANT"
            grep -q 'Private H0sS-Money release certificate' "$DIR/SIGNING-NOTE.txt"
            grep -q '8967c433f04f9e2879f88a95f92c95d268316163d84db3442ef221f415fae91c' "$DIR/signature.txt"
            grep -q "versionName='1.2.5'" "$DIR/package.txt"
            grep -q "versionCode='8'" "$DIR/package.txt"
            APK="$DIR/H0sS-Money-1.2.5-$VARIANT.apk"
            EXPECTED=$(awk '{print $1}' "$DIR/SHA256SUMS.txt")
            ACTUAL=$(sha256sum "$APK" | awk '{print $1}')
            [ "$EXPECTED" = "$ACTUAL" ]
            cp "$APK" delivery/
          done
          for API in 29 35 36; do
            grep -q '^PASS:' "qa/android-smoke-evidence-api-$API/result.txt"
            grep -q '^PASS:' "qa/android-smoke-evidence-api-$API/exports-result.txt"
          done
          (cd delivery && sha256sum *.apk > SHA256SUMS.txt)
          cp docs/RELEASE-1.2.5.md delivery/H0sS-Money-1.2.5-Report.md
          printf '\nSource: %s\nBuild: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> delivery/H0sS-Money-1.2.5-Report.md
          python3 - <<'PY'
          import pathlib,zipfile
          with zipfile.ZipFile('delivery/H0sS-Money-1.2.5-UI-QA.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in sorted(pathlib.Path('qa').rglob('*')):
              if p.is_file() and p.suffix in ['.png','.pdf','.mp4','.xml','.txt'] and p.name!='logcat.txt':z.write(p,p.relative_to('qa'))
          PY
      - name: Publish verified APKs
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.2.5" >/dev/null 2>&1; then echo 'Release already exists; refusing overwrite.'; exit 1; fi
          gh release create v1.2.5 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title 'H0sS-Money 1.2.5' --notes-file delivery/H0sS-Money-1.2.5-Report.md delivery/*.apk delivery/SHA256SUMS.txt delivery/H0sS-Money-1.2.5-Report.md delivery/H0sS-Money-1.2.5-UI-QA.zip
          gh release edit v1.2.5 --repo "$GITHUB_REPOSITORY" --draft=false --latest
