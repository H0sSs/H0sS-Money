name: Verify and publish final 1.2.4 without native rebuild
on:
  push:
    branches: [fix/verify-financial-1.2.4]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require verified native base and JS-only source difference
        run: |
          python3 - <<'PY'
          import os,json,subprocess
          base='10c27c14e02e3f5d7cca86bffb107dd83fbe7b10'
          changed=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          allowed=['lib/db.ts','lib/transactions.ts','lib/finance.ts','lib/financeBackup.ts','lib/statsReport.ts','components/ExpenseReview.tsx','components/FinanceScreen.tsx','components/Ledger.tsx','CHANGELOG.md','README.md']
          assert all(p in allowed or p.startswith(('docs/','tests/','scripts/','.github/workflows/')) for p in changed), 'Native/input changes require full Gradle build'
          repo='repos/'+os.environ['GITHUB_REPOSITORY']
          run=json.loads(subprocess.check_output(['gh','api',repo+'/actions/runs/38301676347'],text=True));assert run['head_sha']==base
          jobs={j['name']:j['conclusion'] for j in json.loads(subprocess.check_output(['gh','api',repo+'/actions/runs/38301676347/jobs'],text=True))['jobs']}
          assert all(jobs.get(n)=='success' for n in ['validate','build (arm64)','build (universal)'])
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - run: npm ci --legacy-peer-deps
      - run: npm run check
      - run: npx expo-doctor
      - uses: actions/download-artifact@v4
        with:
          pattern: H0sS-Money-release-*
          path: base-apks
          run-id: 38301676347
          github-token: ${{ github.token }}
      - name: Prepare owner signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HOSS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_BASE64" ]
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hoss-release.jks"
          echo "HOSS_KEYSTORE_PATH=$RUNNER_TEMP/hoss-release.jks" >> "$GITHUB_ENV"
      - name: Build matching optimized Hermes bundle
        env:
          HOSS_APK_VERSION: '1.2.4'
          HOSS_VERSION_CODE: '7'
          HOSS_REQUIRE_PRIVATE_SIGNING: 'true'
          HOSS_CERTIFICATE_SHA256: '8967c433f04f9e2879f88a95f92c95d268316163d84db3442ef221f415fae91c'
          HOSS_KEYSTORE_PASSWORD: ${{ secrets.HOSS_KEYSTORE_PASSWORD }}
          HOSS_KEY_ALIAS: ${{ secrets.HOSS_KEY_ALIAS }}
          HOSS_KEY_PASSWORD: ${{ secrets.HOSS_KEY_PASSWORD }}
        run: |
          npx expo prebuild --platform android --clean --no-install
          npx expo export:embed --platform android --dev false --minify false --unstable-transform-profile hermes --entry-file node_modules/expo-router/entry.js --bundle-output /tmp/hoss-index.js --assets-dest /tmp/hoss-assets
          node_modules/react-native/sdks/hermesc/linux64-bin/hermesc -O -emit-binary -output-source-map -out /tmp/hoss-index.android.bundle /tmp/hoss-index.js
          node scripts/check-launch-resources.cjs
          python3 scripts/rebundle-apks.py
      - name: Remove private key
        if: always()
        run: rm -f "$RUNNER_TEMP/hoss-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: H0sS-Money-release-arm64
          path: output/arm64
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: H0sS-Money-release-universal
          path: output/universal
          if-no-files-found: error
          retention-days: 30
  smoke:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [29,35,36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: H0sS-Money-release-universal
          path: output
      - run: python3 -m pip install pypdf pillow
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/smoke-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-evidence-api-${{ matrix.api }}
          path: smoke
          if-no-files-found: ignore

  publish:
    needs: [assemble, smoke]
    if: github.ref == 'refs/heads/fix/verify-financial-1.2.4'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: H0sS-Money-release-*
          path: downloads
      - uses: actions/download-artifact@v4
        with:
          pattern: android-smoke-evidence-api-*
          path: qa
      - name: Verify private signatures and collect release files
        run: |
          set -euo pipefail
          mkdir -p delivery
          for VARIANT in arm64 universal; do
            DIR="downloads/H0sS-Money-release-$VARIANT"
            grep -q 'Private H0sS-Money release certificate' "$DIR/SIGNING-NOTE.txt"
            grep -q '8967c433f04f9e2879f88a95f92c95d268316163d84db3442ef221f415fae91c' "$DIR/signature.txt"
            grep -q "versionName='1.2.4'" "$DIR/package.txt"
            grep -q "versionCode='7'" "$DIR/package.txt"
            APK="$DIR/H0sS-Money-1.2.4-$VARIANT.apk"
            EXPECTED=$(awk '{print $1}' "$DIR/SHA256SUMS.txt")
            ACTUAL=$(sha256sum "$APK" | awk '{print $1}')
            [ "$EXPECTED" = "$ACTUAL" ]
            cp "$APK" delivery/
          done
          for API in 29 35 36; do
            grep -q '^PASS:' "qa/android-smoke-evidence-api-$API/result.txt"
            grep -q '^PASS:' "qa/android-smoke-evidence-api-$API/exports-result.txt"
          done
          (cd delivery && sha256sum *.apk > SHA256SUMS.txt)
          cp docs/RELEASE-1.2.4.md delivery/H0sS-Money-1.2.4-Report.md
          printf '\nSource: %s\nBuild: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> delivery/H0sS-Money-1.2.4-Report.md
          python3 - <<'PY'
          import pathlib,zipfile
          with zipfile.ZipFile('delivery/H0sS-Money-1.2.4-UI-QA.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in sorted(pathlib.Path('qa').rglob('*')):
              if p.is_file() and p.suffix in ['.png','.pdf','.mp4','.xml','.txt'] and p.name!='logcat.txt':z.write(p,p.relative_to('qa'))
          PY
      - name: Publish verified APKs
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.2.4" >/dev/null 2>&1; then echo 'Release already exists; refusing overwrite.'; exit 1; fi
          gh release create v1.2.4 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title 'H0sS-Money 1.2.4' --notes-file delivery/H0sS-Money-1.2.4-Report.md delivery/*.apk delivery/SHA256SUMS.txt delivery/H0sS-Money-1.2.4-Report.md delivery/H0sS-Money-1.2.4-UI-QA.zip
          gh release edit v1.2.4 --repo "$GITHUB_REPOSITORY" --draft=false --latest
