name: Validate JS-only 1.2.3 PDF hotfix
on:
  push:
    branches: [fix/validate-export-1.2.3]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require verified native base and JS-only source difference
        run: |
          python3 - <<'PY'
          import os,json,subprocess
          base='de98b8c24fa287ce000f44dcbc742bf9fb0903ea'
          changed=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          allowed=['lib/statsReport.ts','app/(tabs)/stats.tsx','lib/drive.ts','CHANGELOG.md']
          assert all(p in allowed or p.startswith(('docs/','tests/','scripts/','.github/workflows/')) for p in changed), 'Native/input changes require full Gradle build'
          repo='repos/'+os.environ['GITHUB_REPOSITORY']
          run=json.loads(subprocess.check_output(['gh','api',repo+'/actions/runs/38278402182'],text=True));assert run['head_sha']==base
          jobs={j['name']:j['conclusion'] for j in json.loads(subprocess.check_output(['gh','api',repo+'/actions/runs/38278402182/jobs'],text=True))['jobs']}
          assert all(jobs.get(n)=='success' for n in ['validate','build (arm64)','build (universal)'])
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - run: npm ci --legacy-peer-deps
      - run: npm run check
      - run: npx expo-doctor
      - uses: actions/download-artifact@v4
        with:
          pattern: H0sS-Money-release-*
          path: base-apks
          run-id: 38278402182
          github-token: ${{ github.token }}
      - name: Build matching optimized Hermes bundle
        run: |
          npx expo prebuild --platform android --clean --no-install
          npx expo export:embed --platform android --dev false --minify false --unstable-transform-profile hermes --entry-file node_modules/expo-router/entry.js --bundle-output /tmp/hoss-index.js --assets-dest /tmp/hoss-assets
          node_modules/react-native/sdks/hermesc/linux64-bin/hermesc -O -emit-binary -output-source-map -out /tmp/hoss-index.android.bundle /tmp/hoss-index.js
          python3 scripts/rebundle-apks.py
      - uses: actions/upload-artifact@v4
        with:
          name: H0sS-Money-release-arm64
          path: output/arm64
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: H0sS-Money-release-universal
          path: output/universal
          if-no-files-found: error
          retention-days: 30
  smoke:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [29,35,36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: H0sS-Money-release-universal
          path: output
      - run: python3 -m pip install pypdf pillow
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/smoke-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-evidence-api-${{ matrix.api }}
          path: smoke
          if-no-files-found: ignore
