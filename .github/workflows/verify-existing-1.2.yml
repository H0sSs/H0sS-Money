name: Verify existing 1.2 APK
on:
  push:
    branches: [fix/qa-1.2]
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: H0sS-Money-release-universal
          path: output
          run-id: 38157655779
          github-token: ${{ github.token }}
      - name: Require exact compiled APK
        run: echo 'af0b38d52d7439cbe63a328fa77070c3b504fdd19fe20418d9dd205169a05b74  output/H0sS-Money-1.2.0-universal.apk' | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/smoke-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-evidence-api-${{ matrix.api }}
          path: smoke/
          if-no-files-found: ignore
