name: Publish verified 1.1.0 release
on:
  push:
    branches: [fix/apk-delivery-review]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify owned draft and publish unchanged assets
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/409001550" > release.json
          python3 - <<'PY'
          import json
          r=json.load(open('release.json'))
          assert r['id']==409001550 and r['draft'] is True
          assert r['tag_name']=='review-1.1.0-51e0e65'
          assert r['target_commitish']=='51e0e65b2ee4611ba8907ca0dd008a9e5bf8e146'
          expected=[{"name":"H0sS-Money-1.1.0-arm64.apk","size":32272641,"digest":"sha256:f1b3908e8237aa4366cb406a673871a478b10f176e12090eec86168adffbbc5e"},{"name":"H0sS-Money-1.1.0-Report.md","size":5059,"digest":"sha256:1c0214b235a6b525dc128bb20d19f0de20ab1457890a22f393e6f56d0061e2b8"},{"name":"H0sS-Money-1.1.0-universal.apk","size":89380938,"digest":"sha256:4f00480f13cc286584603d503f40cc860f5f5ad8334222fc3cb4a66c264422fa"},{"name":"H0sS-Money-UI-QA.zip","size":2410682,"digest":"sha256:dcb60cc65875a06f096923de40dfac4ce045e1754b960aaa927c6dcd1f921e4d"},{"name":"SHA256SUMS.txt","size":190,"digest":"sha256:5e60b11ae54018eee0c27ec85b5d1867b6fc02c2e128aaed04b584a7a70d216b"}]
          actual=[{k:a[k] for k in ['name','size','digest']} for a in r['assets']]
          assert sorted(actual,key=lambda a:a['name'])==sorted(expected,key=lambda a:a['name'])
          body=r['body'].replace('تقرير التسليم','تقرير الإصدار')
          body+='\n\nPublished release assets are identical to the verified review APKs.\n'
          json.dump({'tag_name':'v1.1.0','target_commitish':r['target_commitish'],'name':'H0sS-Money 1.1.0','body':body,'draft':False,'prerelease':False,'make_latest':'true'},open('publish.json','w'))
          PY
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/409001550" --input publish.json --jq '{url: .html_url, draft: .draft, tag: .tag_name}'
