name: Validate and build release APK
on:
  push:
    branches: [main, master]
    paths-ignore: ['README.md', 'CHANGELOG.md', 'docs/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.meta.outputs.version }}
      code: ${{ steps.meta.outputs.code }}
      base_tag: ${{ steps.meta.outputs.base_tag }}
      base_version: ${{ steps.meta.outputs.base_version }}
      base_code: ${{ steps.meta.outputs.base_code }}
      published: ${{ steps.meta.outputs.published }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the latest public release and target version
        id: meta
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > latest-release.json
          python3 scripts/verify-build-base.py prepare --release-json latest-release.json
      - name: Check native compatibility against the latest release tag
        env:
          HOSS_BASE_TAG: ${{ steps.meta.outputs.base_tag }}
        run: python3 scripts/check-native-reuse.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Download only the latest release APKs
        env:
          BASE_TAG: ${{ steps.meta.outputs.base_tag }}
          BASE_VERSION: ${{ steps.meta.outputs.base_version }}
        run: |
          set -euo pipefail
          for VARIANT in arm64 universal; do
            DIR="base-apks/H0sS-Money-release-$VARIANT"
            mkdir -p "$DIR"
            gh release download "$BASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "H0sS-Money-$BASE_VERSION-$VARIANT.apk" --dir "$DIR"
          done
      - name: Verify base checksums, certificate, version and alignment
        run: |
          python3 scripts/verify-build-base.py verify
          cp build-base.json base-apks/build-base.json
      - uses: actions/upload-artifact@v4
        if: steps.meta.outputs.published != 'true'
        with:
          name: verified-base-apks
          path: base-apks/
          if-no-files-found: error
      - name: Keep the existing public release unchanged
        if: steps.meta.outputs.published == 'true'
        run: echo 'Published application source is unchanged; compatibility verified. No APK rebuild or release overwrite needed.'
  validate:
    needs: compatibility
    if: needs.compatibility.outputs.published != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run check
      - run: node scripts/check-voice-routing.cjs
      - run: npx expo-doctor
      - run: npx expo export --platform android --no-bytecode --output-dir /tmp/android-export
      - name: Compile optimized release Hermes bytecode
        run: node_modules/react-native/sdks/hermesc/linux64-bin/hermesc -w -O -g0 -emit-binary -out /tmp/hoss-index.android.bundle /tmp/android-export/_expo/static/js/android/*.js
      - uses: actions/upload-artifact@v4
        with:
          name: checked-hermes-bundle
          path: /tmp/hoss-index.android.bundle
          if-no-files-found: error
  build:
    needs: [compatibility, validate]
    if: needs.compatibility.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOSS_APK_VERSION: ${{ needs.compatibility.outputs.version }}
      HOSS_VERSION_CODE: ${{ needs.compatibility.outputs.code }}
      HOSS_BASE_VERSION: ${{ needs.compatibility.outputs.base_version }}
      HOSS_BASE_CODE: ${{ needs.compatibility.outputs.base_code }}
      HOSS_CERTIFICATE_SHA256: '8967c433f04f9e2879f88a95f92c95d268316163d84db3442ef221f415fae91c'
      HOSS_KEYSTORE_PASSWORD: ${{ secrets.HOSS_KEYSTORE_PASSWORD }}
      HOSS_KEY_ALIAS: ${{ secrets.HOSS_KEY_ALIAS }}
      HOSS_KEY_PASSWORD: ${{ secrets.HOSS_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: checked-hermes-bundle
          path: /tmp/checked-hermes
      - uses: actions/download-artifact@v4
        with:
          name: verified-base-apks
          path: base-apks
      - name: Prepare the checked optimized bytecode
        run: cp /tmp/checked-hermes/*.bundle /tmp/hoss-index.android.bundle
      - name: Sign checked APKs with the private release key
        env:
          KEYSTORE_BASE64: ${{ secrets.HOSS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hoss-release.jks"
          chmod 600 "$RUNNER_TEMP/hoss-release.jks"
          export HOSS_KEYSTORE_PATH="$RUNNER_TEMP/hoss-release.jks"
          python3 scripts/rebundle-apks.py
      - uses: actions/upload-artifact@v4
        with:
          name: H0sS-Money-release-arm64
          path: output/arm64/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: H0sS-Money-release-universal
          path: output/universal/
          if-no-files-found: error
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: H0sS-Money-release-universal
          path: output
      - name: Reuse checked PR evidence only for an identical source tree
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_API: ${{ matrix.api }}
        run: python3 scripts/reuse-smoke.py
      - run: python3 -m pip install pypdf pillow
        if: steps.reuse.outputs.reused != 'true'
      - name: Enable KVM
        if: steps.reuse.outputs.reused != 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        if: steps.reuse.outputs.reused != 'true'
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/smoke-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-evidence-api-${{ matrix.api }}
          path: smoke/
          if-no-files-found: ignore

  publish:
    needs: [compatibility, validate, build, smoke]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.compatibility.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.compatibility.outputs.version }}
      VERSION_CODE: ${{ needs.compatibility.outputs.code }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: H0sS-Money-release-*
          path: downloads
      - uses: actions/download-artifact@v4
        with:
          pattern: android-smoke-evidence-api-*
          path: qa
      - name: Verify private signatures and collect release files
        run: |
          set -euo pipefail
          mkdir -p delivery
          for VARIANT in arm64 universal; do
            DIR="downloads/H0sS-Money-release-$VARIANT"
            grep -q 'Private H0sS-Money release certificate' "$DIR/SIGNING-NOTE.txt"
            grep -q '8967c433f04f9e2879f88a95f92c95d268316163d84db3442ef221f415fae91c' "$DIR/signature.txt"
            grep -q "versionName='$VERSION'" "$DIR/package.txt"
            grep -q "versionCode='$VERSION_CODE'" "$DIR/package.txt"
            APK="$DIR/H0sS-Money-$VERSION-$VARIANT.apk"
            EXPECTED=$(awk '{print $1}' "$DIR/SHA256SUMS.txt")
            ACTUAL=$(sha256sum "$APK" | awk '{print $1}')
            [ "$EXPECTED" = "$ACTUAL" ]
            cp "$APK" delivery/
          done
          for API in 29 35 36; do
            grep -q '^PASS:' "qa/android-smoke-evidence-api-$API/result.txt"
            grep -q '^PASS:' "qa/android-smoke-evidence-api-$API/exports-result.txt"
          done
          (cd delivery && sha256sum *.apk > SHA256SUMS.txt)
          cp docs/RELEASE-$VERSION.md delivery/H0sS-Money-$VERSION-Report.md
          printf '\nSource: %s\nBuild: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> delivery/H0sS-Money-$VERSION-Report.md
          python3 - <<'PY'
          import pathlib,zipfile
          import os
          version=os.environ['VERSION']
          with zipfile.ZipFile('delivery/H0sS-Money-'+version+'-UI-QA.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in sorted(pathlib.Path('qa').rglob('*')):
              if p.is_file() and p.suffix in ['.png','.pdf','.mp4','.xml','.txt'] and p.name!='logcat.txt':z.write(p,p.relative_to('qa'))
          PY
      - name: Publish verified APKs
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" >/dev/null 2>&1; then echo 'Release already exists; refusing overwrite.'; exit 1; fi
          gh release create v$VERSION --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "H0sS-Money $VERSION" --notes-file delivery/H0sS-Money-$VERSION-Report.md delivery/*.apk delivery/SHA256SUMS.txt delivery/H0sS-Money-$VERSION-Report.md delivery/H0sS-Money-$VERSION-UI-QA.zip
          gh release edit v$VERSION --repo "$GITHUB_REPOSITORY" --draft=false --latest
